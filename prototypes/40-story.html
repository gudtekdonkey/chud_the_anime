<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger Tales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --ink: #131517; --ink2: #1b1e20; --slate: #474c4a; --line: #2c3130; --mute: #8d9693; --text: #dfe4e2;
  --cyan: #6ff3e4; --cyan2: #52e8d6; --pale: #b8fff6; --washi: #d8d1bf; --washi2: #c9c0aa; --sumi: #22201c; --seal: #b3412f; --gold: #c9a45a;
  --display: 'Shippori Mincho', 'Hiragino Mincho ProN', Georgia, serif;
  --body: 'Zen Kaku Gothic New', 'Hiragino Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--text); font: 14px/1.5 var(--body); }
body { padding-inline: 16px; padding-block: 14px 40px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: .01em; }
button, input { font: inherit; }
button { background: var(--ink2); color: var(--text); border: 1px solid var(--slate); padding: 5px 11px; cursor: pointer; border-radius: 2px; }
button:hover { border-color: var(--cyan2); color: var(--pale); }
button:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
button.primary { border-color: var(--cyan2); color: var(--cyan); }
button:disabled { opacity: .45; cursor: not-allowed; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--mute); }

header { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 28px; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 14px; }
header h1 { font-size: 30px; line-height: 1; }
header h1 small { display: block; font: 400 12px var(--body); color: var(--mute); letter-spacing: .04em; margin-top: 6px; }
.clock { font-family: var(--display); font-size: 20px; color: var(--pale); }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.controls input { width: 80px; background: var(--ink2); color: var(--text); border: 1px solid var(--slate); padding: 5px 8px; border-radius: 2px; }
.him { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; margin-left: auto; }
.him b { font-family: var(--display); font-size: 16px; color: var(--text); }
.him .num { color: var(--pale); }

main { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; align-items: start; }
@media (max-width: 1180px) { main { grid-template-columns: minmax(260px, 400px) minmax(0, 1fr); } #questCol { grid-column: 1 / -1; } }
@media (max-width: 760px) { main { grid-template-columns: 1fr; } }
section > h2 { font-size: 18px; margin-bottom: 8px; }
.panel { border-top: 1px solid var(--line); padding-top: 10px; }

#map { width: 100%; max-width: 400px; aspect-ratio: 1; image-rendering: pixelated; display: block; cursor: crosshair; background: #0e1112; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--mute); margin-top: 6px; }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; }
#chart { width: 100%; height: 150px; display: block; margin-top: 6px; }
.feed { max-height: 300px; overflow-y: auto; font-size: 13px; margin-top: 6px; }
.feed div { padding: 4px 0; border-bottom: 1px dotted var(--line); display: grid; grid-template-columns: 74px 1fr; gap: 8px; }
.feed .when { color: var(--mute); font-family: var(--mono); font-size: 11px; padding-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip { font-size: 11px; padding: 2px 8px; border: 1px solid var(--slate); border-radius: 10px; cursor: pointer; background: none; }
.chip.on { border-color: var(--cyan2); color: var(--cyan); }

/* the board: a wooden frame with washi slips pinned to it */
.board { background: #2a241c; border: 6px solid #3a3025; padding: 14px; box-shadow: inset 0 0 0 1px #4a3d2e; }
.board h2 { color: var(--washi); font-size: 22px; }
.board .sub { color: #a89d86; font-size: 12px; margin-bottom: 10px; }
.tale { background: var(--washi); color: var(--sumi); padding: 10px 12px; margin-bottom: 12px; border-left: 4px solid var(--seal); }
.tale h3 { font-size: 17px; }
.tale p { margin: 4px 0 0; }
.tale .also { font-size: 12px; color: #6a6252; margin-top: 4px; }
.signs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.sign { font-size: 12px; padding: 2px 8px; background: #3a3025; color: #cfc4ab; border-radius: 2px; }
.sign.hot { background: var(--seal); color: #fff1e8; }
.mood { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px 14px; margin-bottom: 12px; }
.meter { font-size: 11px; color: #cfc4ab; }
.meter .bar { display: block; height: 5px; background: #3a3025; margin-top: 3px; }
.meter .bar i { display: block; height: 100%; background: var(--washi2); }
.meter.bad .bar i { background: var(--seal); }
.slips { display: grid; gap: 8px; }
.slip { background: var(--washi); color: var(--sumi); padding: 9px 11px; cursor: pointer; text-align: left; border: 0; border-radius: 0; position: relative; width: 100%; }
.slip:hover, .slip.sel { outline: 2px solid var(--cyan); outline-offset: 1px; color: var(--sumi); }
.slip h4 { margin: 0; font: 700 14px var(--body); }
.slip .meta { font-size: 11px; color: #6a6252; display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
.slip .seal { position: absolute; right: 8px; top: 8px; font: 600 11px var(--mono); color: var(--seal); }
.news { margin-top: 12px; font-size: 13px; color: #d9cfb8; }
.news p { margin: 0; padding: 5px 0; border-bottom: 1px dashed #4a3d2e; }
.news .h { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #a89d86; margin-right: 6px; }
.empty { color: #a89d86; font-style: italic; font-size: 13px; }

#quest h2 { font-size: 22px; }
#quest .q-text { max-width: 62ch; }
.who { font-size: 12px; color: var(--mute); }
.ways { display: grid; gap: 8px; margin-top: 12px; }
.way { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; border: 1px solid var(--line); padding: 8px 10px; background: var(--ink2); }
.way h4 { margin: 0; font: 700 14px var(--body); }
.way .tag { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--cyan2); margin-right: 6px; }
.way p { margin: 0; font-size: 12px; color: var(--mute); grid-column: 1; }
.way .fx { grid-column: 1; font: 12px var(--mono); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.way button { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
.up { color: var(--cyan); } .down { color: #e2826f; }
.outcome { border-left: 3px solid var(--cyan); padding: 8px 12px; background: var(--ink2); margin-top: 12px; }
.outcome.world { border-color: var(--slate); }
.cmp { overflow-x: auto; margin-top: 12px; }
.cmp table { border-collapse: collapse; font-size: 12px; min-width: 680px; }
.cmp th, .cmp td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cmp th { font-weight: 400; color: var(--mute); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.cmp td.num { text-align: right; white-space: nowrap; }
.cmp td.story { min-width: 220px; max-width: 300px; }
.cmp td:first-child { min-width: 120px; }
.hint { font-size: 12px; color: var(--mute); margin-top: 6px; max-width: 62ch; }
.busy { color: var(--cyan); font-size: 12px; }
</style>
</head>

<header>
  <h1>Ledger Tales<small>Prototype 40 · quests and world events, made by the world</small></h1>
  <div><div class="label">Now</div><div class="clock" id="clock">…</div></div>

</header>

			const o = resolveQuest(C, q.id, w.id);
			return o ? o.text : "nothing happened";
		});
		play("Nobody comes", (C) => {
			const Q = C.sys.story.quests[q.id];
			advance(C, Math.max(1, Q.due - Math.floor(C.hour / 24) + 1) * 24);
			const R = C.sys.story.quests[q.id];
			return R && R.outcome ? (R.outcome.by ? `${rivalName(C, R.outcome.by)}: ` : "") + R.outcome.text : "still open";
		});
		cmp = {
			id: q.id,
			rows
		};
	}
	function drawHim() {
		const p = me(), c = chapterOf(L), S = ST(L), st = Object.entries(p.standing).filter(([, v]) => v).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 2);
		$("him").innerHTML = `<div><div class="label">The ronin</div><b>${esc(nameOf(p))}${c.epithet ? " " + c.epithet : ""}</b></div>
    <div><div class="label">Chapter ${c.n}</div><b>${esc(c.title)}</b></div>
    <div><div class="label">Karma</div><span class="num">${p.karma}</span></div><div><div class="label">Mon</div><span class="num">${p.money.mon}</span> <button id="purse" title="For testing: ways that cost money">+500</button></div>
    <div><div class="label">Renown</div><span class="num">${S.arc.renown}</span></div>
    <div><div class="label">Service</div><span>${p.master ? `sworn to ${esc(who(p.master))} · warnings ${S.service ? S.service.warnings || 0 : 0}/3 <button id="oath">Break the oath</button>` : `<button id="swear" title="For testing: swear to the lord of the region on the board">Swear to ${esc(who(L.regions[sel].lord))}</button>`}</span>${(S.wanted || []).length ? ` <span class="down">wanted by ${S.wanted.map((w) => esc(w.by != null ? who(w.by) : L.cultures[w.culture].name)).join(", ")}</span>` : ""}</div>
    <div><div class="label">Standing</div><span>${st.map(([k, v]) => `${esc(L.cultures[k].name.replace(/^the /, ""))} ${sign(Math.round(v * 100))}`).join(", ") || "unknown to all"}</span></div>`;
	}
	function draw() {
		const c = calendar(L.hour);
		$("clock").textContent = `Year ${c.year}, ${c.season}, day ${c.dayOfSeason}`;
		drawMap();
		drawChart();
		drawBoard();
		drawQuest();
		drawHim();
	}
	$("regen").onclick = () => make(+$("seed").value || 1);
	$("d7").onclick = () => live(168);
	$("season").onclick = () => live(672);
	$("year").onclick = () => live(2688);
	$("ten").onclick = () => live(26880);
	$("map").onclick = (e) => {
		const r = e.target.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * 100), y = Math.floor((e.clientY - r.top) / r.height * 100), z = L.zones[y * 100 + x];
		if (z && z.region >= 0) {
			sel = z.region;
			draw();
		}
	};
	document.addEventListener("click", (e) => {
		const t = e.target.closest("[data-q],[data-way],[data-cat],#compare,#untouched,#take,#purse,#oath,#swear");
		if (!t) return;
		const q = qsel && quest(L, qsel);
		if (t.dataset.q) {
			qsel = t.dataset.q;
			cmp = null;
			draw();
		} else if (t.dataset.cat) {
			cats.has(t.dataset.cat) ? cats.delete(t.dataset.cat) : cats.add(t.dataset.cat);
			drawChart();
		} else if (t.dataset.way && q) {
			if (q.state === "open") takeQuest(L, q.id);
			resolveQuest(L, q.id, t.dataset.way);
			cmp = null;
			draw();
		} else if (t.id === "take" && q) {
			takeQuest(L, q.id);
			draw();
		} else if (t.id === "purse") {
			me().money.mon += 500;
			draw();
		} else if (t.id === "oath") {
			breakOath(L);
			draw();
		} else if (t.id === "swear" && L.regions[sel].lord) {
			const S = ST(L);
			me().master = L.regions[sel].lord;
			S.arc.sworn = me().master;
			S.arc.chapter = Math.max(S.arc.chapter, 3);
			S.service = {
				lord: me().master,
				since: today(),
				warnings: 0,
				orders: []
			};
			draw();
		} else if (t.id === "untouched" && q) live(Math.max(1, q.due - today() + 1) * 24);
		else if (t.id === "compare" && q) {
			$("cmpOut").innerHTML = "<p class=\"busy\">Living it out on copies of the world…</p>";
			setTimeout(() => {
				compare(q);
				drawQuest();
			}, 20);
		}
	});
	make(12345);
	//#endregion
})();

</script>
</body>
</html>
